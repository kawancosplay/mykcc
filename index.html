<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign Vite dev server WebSocket HMR connection errors in cloud sandbox
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event.reason && (event.reason.message || event.reason)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
    <title>MyKCC - KawanCosplay Community Member Portal</title>
    <meta name="description" content="MyKCC - KawanCosplay Community official registration, 16-digit User ID, digital member card, cosplay photo gallery, and Google Sheets sync." />
    <meta property="og:title" content="MyKCC - KawanCosplay Community" />
    <meta property="og:description" content="MyKCC - KawanCosplay Community official registration, 16-digit User ID, digital member card, cosplay photo gallery, and Google Sheets sync." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="MyKCC" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>

  </body>
</html>
